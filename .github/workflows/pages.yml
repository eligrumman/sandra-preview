name: Publish artist preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: artist-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout artist website source
        uses: actions/checkout@v4
        with:
          repository: eligrumman/sandra-books
          ref: feat/immersive-artist-portfolio
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check portfolio
        run: node check-portfolio.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
